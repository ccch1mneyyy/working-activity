allowBuilds:
  esbuild: true
  # koffi ships prebuilt binaries; its postinstall builds from source and is not
  # needed for the node-side plugin tests. pnpm 11 fails CI on an unlisted build
  # script, so deny it explicitly instead of leaving it ambiguous.
  koffi: false

# pnpm 11 no longer reads package.json's "pnpm" field, so settings live here.
#
# The development graph is pinned to the DSH 0.2.1-rc.2 corridor (cordis 4.0.5).
# The legacy definition spellings are asserted in the unit suite; the alpha.2 and
# 0.1.7 corridors run in their own isolated compatibility fixtures under
# packages/activity/, so no pnpm override is needed here.
